services:
  - type: web
    name: clout-platform-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        # This free hosted instance is a staging/demo environment while MoMo,
        # live social provider approval, and ClamAV are still pending. Switch
        # to production only when all production integrations are configured.
        value: development
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: DEFAULT_CURRENCY
        value: RWF
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: MEDIA_ROOT
        value: /app/media
      # Fill these from an S3-compatible provider (Cloudflare R2, AWS S3, or
      # MinIO) before accepting public media. Keep the bucket credentials as
      # Render secrets, never in this file or Git.
      - key: STORAGE_BACKEND
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_URL_EXPIRE_SECONDS
        value: "3600"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: PAYMENT_PROVIDER_MODE
        value: mock
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SOCIAL_OAUTH_MODE
        value: live
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_LIVE_ENABLED
        value: "false"
      - key: EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: CLOUTPLATFORM
      - key: CORS_ORIGINS
        value: '["https://clout-platform-two.vercel.app"]'
      - key: FRONTEND_BASE_URL
        value: https://clout-platform-two.vercel.app
      - key: PUBLIC_BASE_URL
        value: https://clout-platform-backend.onrender.com
